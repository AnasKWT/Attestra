[workspace]
resolver = "2"
members = [
    "common",
    "schemas",
    "attestations",
    "resolvers",
    "credentials",
    "staking",
    "verdicts",
    "token",
    "sandbox-tests",
    "sandbox-tests/doubles/mpc",
    "sandbox-tests/doubles/resolver",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Attestra contributors"]
repository = "https://github.com/attestra/attestra"

[workspace.dependencies]
near-sdk = { version = "5.30.1", default-features = false, features = ["wee_alloc"] }
near-contract-standards = "5.30.1"
borsh = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
attestra-common = { path = "common" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
