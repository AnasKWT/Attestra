[package]
name = "attestra-verdicts"
description = "Attestra verdicts: attestations from AI checks run in an enclave, foreign-chain events verified by the NEAR MPC network, and wallet links."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["unstable"] }
attestra-common = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "unstable"] }
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = "sha256:90cf2abe31d75946d82f1c6eee70802332b4d499ac39c01a5c41f228000ecb8a"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
