[package]
name = "attestra-checker"
description = "Attestra private checker: a WASI P2 component for NEAR OutLayer that runs a rule check on a NEAR AI Cloud verifiable model with end-to-end encryption and signs the verdict with a key bound to its build."
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "attestra-checker"
path = "src/main.rs"

[lib]
name = "attestra_checker"
path = "src/lib.rs"

[dependencies]
base64 = "=0.22.1"
borsh = "=1.8.1"
bs58 = "=0.5.1"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "=0.13.3"
wasi-http-client = "=0.2.1"
wit-bindgen = "=0.36.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
