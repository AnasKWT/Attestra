# The whole Attestra stack against the public testnet contracts:
#   cp .env.example .env    (optional: keys turn on writes, chat and private checks)
#   docker compose up --build
# Site http://localhost:3100, indexer :5100, relayer :5200, agent :5300, keeper :5400, top-up :5500
# (bound to 127.0.0.1: on a VM only Caddy on 80 and 443 faces the internet).
# Without keys every service runs read-only and says so on /health.
# On the services VM add TLS with:  docker compose --profile tls up -d   (see deploy/Caddyfile)

x-node: &node
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &env
    NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
    ATTESTRA_ROOT: ${ATTESTRA_ROOT:-attestra.testnet}
    INDEXER_URL: http://indexer:5100
    # Rate limits count the client from the first X-Forwarded-For hop: only Caddy reaches the services
    # from outside (the ports bind to 127.0.0.1), and it replaces any value a client sends.
    TRUST_PROXY: ${TRUST_PROXY:-true}
  mem_limit: 192m

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestra}
      POSTGRES_DB: attestra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attestra"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  indexer:
    <<: *node
    build: { context: ., dockerfile: apps/indexer/Dockerfile }
    environment:
      <<: *env
      DATABASE_URL: postgres://attestra:${POSTGRES_PASSWORD:-attestra}@postgres:5432/attestra
      PORT: "5100"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:5100:5100"]

  agent:
    <<: *node
    build: { context: ., dockerfile: apps/agent/Dockerfile }
    environment:
      <<: *env
      AGENT_PORT: "5300"
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-http://localhost:5300}
    ports: ["127.0.0.1:5300:5300"]

  relayer:
    <<: *node
    build: { context: ., dockerfile: services/Dockerfile }
    command: ["node", "--import", "tsx", "src/main.ts", "relayer"]
    volumes: ["relayer-data:/app/services/.data"]
    ports: ["127.0.0.1:5200:5200"]

  keeper:
    <<: *node
    build: { context: ., dockerfile: services/Dockerfile }
    command: ["node", "--import", "tsx", "src/main.ts", "keeper"]
    volumes: ["keeper-data:/app/services/.data"]
    ports: ["127.0.0.1:5400:5400"]

  topup:
    <<: *node
    build: { context: ., dockerfile: services/Dockerfile }
    command: ["node", "--import", "tsx", "src/main.ts", "topup"]
    volumes: ["topup-data:/app/services/.data"]
    ports: ["127.0.0.1:5500:5500"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    profiles: ["site"]
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST:-api.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [indexer, agent, relayer, keeper, topup]

volumes:
  pgdata:
  relayer-data:
  keeper-data:
  topup-data:
  caddy-data:
